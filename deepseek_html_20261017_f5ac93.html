<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GölgeOS v3.2</title>
<style>
:root{--accent:#33ff66;--accent-dim:rgba(51,255,102,.3);--accent-bg:rgba(51,255,102,.12);--accent-glow:rgba(51,255,102,.4);--bg:#0a0e1a;--panel:rgba(10,16,26,.96)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#000;color:#e6edf7;user-select:none}
#boot{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:'JetBrains Mono',monospace;color:var(--accent)}
#boot.off{opacity:0;pointer-events:none;transition:opacity .8s}
#boot .logo{font-size:52px;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,var(--accent),#22d3ee,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glowPulse 2s infinite}
@keyframes glowPulse{50%{filter:drop-shadow(0 0 20px #22d3ee)}}
#boot .bar{width:280px;height:4px;background:var(--accent-bg);border-radius:2px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#22d3ee);animation:bootBar 2.2s ease-out forwards}
@keyframes bootBar{to{width:100%}}
#boot .msg{font-size:12px;color:#6b8fad;letter-spacing:2px}
#boot .lines{font-size:11px;color:#6b8fad;line-height:1.7;height:90px;width:360px}
#desktop{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#wallpaper{position:absolute;inset:0;z-index:1}
#wallpaper canvas{width:100%;height:100%;display:block;transition:opacity .3s}
#wallpaper::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(34,211,238,.08),transparent 60%),radial-gradient(circle at 70% 70%,rgba(167,139,250,.08),transparent 60%)}
#icons{position:absolute;top:20px;left:20px;z-index:5;display:flex;flex-direction:column;gap:4px;flex-wrap:wrap;max-height:calc(100vh - 120px);align-content:flex-start}
.dsk-icon{width:92px;padding:10px 6px;border-radius:10px;text-align:center;cursor:pointer;transition:.15s;color:#fff}
.dsk-icon:hover{background:var(--accent-bg);backdrop-filter:blur(8px)}
.dsk-icon.selected{background:var(--accent-bg);outline:1px solid var(--accent-dim)}
.dsk-icon .ico{width:44px;height:44px;margin:0 auto 6px;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.dsk-icon .ico svg{width:100%;height:100%;display:block}
.dsk-icon .lbl{font-size:11px;line-height:1.3;text-shadow:0 1px 2px rgba(0,0,0,.9);word-break:break-word;font-weight:500}
.win{position:absolute;z-index:100;min-width:280px;min-height:180px;background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--accent-dim);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.5);animation:winOpen .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes winOpen{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.win.focused{border-color:var(--accent-glow);box-shadow:0 20px 60px rgba(0,0,0,.85),0 0 0 1px var(--accent-dim),0 0 40px var(--accent-bg)}
.win.minimized{display:none}
.win.maximized{top:0!important;left:0!important;width:100%!important;height:calc(100% - 44px)!important;border-radius:0}
.win-title{height:36px;background:linear-gradient(180deg,var(--accent-bg),rgba(51,255,102,.02));display:flex;align-items:center;padding:0 10px;gap:10px;cursor:move;border-bottom:1px solid var(--accent-dim);flex-shrink:0}
.win-title .ic{width:16px;height:16px;flex-shrink:0}
.win-title .ic svg{width:100%;height:100%;display:block}
.win-title .ttl{flex:1;font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1px;font-family:'JetBrains Mono',monospace}
.win-btns{display:flex;gap:6px}
.win-btn{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:rgba(255,255,255,.05);color:#c6d4e6;border:none;transition:.15s}
.win-btn:hover{background:rgba(255,255,255,.15)}
.win-btn.close:hover{background:#ef4444;color:#fff}
.win-body{flex:1;overflow:auto;position:relative;color:#e6edf7}
.win-resize{position:absolute;bottom:0;right:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--accent-glow) 50%)}
#taskbar{position:absolute;bottom:0;left:0;right:0;height:44px;z-index:500;background:rgba(3,8,12,.92);backdrop-filter:blur(24px);border-top:1px solid var(--accent-dim);display:flex;align-items:center;padding:0 10px;gap:10px}
#startBtn{display:flex;align-items:center;gap:8px;padding:7px 16px;border-radius:8px;background:linear-gradient(135deg,var(--accent-bg),rgba(34,211,238,.15));border:1px solid var(--accent-dim);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;letter-spacing:1.5px}
#startBtn svg{width:14px;height:14px}
#tasks{flex:1;display:flex;gap:6px;overflow-x:auto;align-items:center}
.task-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid transparent;font-size:11.5px;color:#c6d4e6;cursor:pointer;max-width:180px;font-family:'JetBrains Mono',monospace}
.task-btn.active{background:var(--accent-bg);border-color:var(--accent-dim);color:var(--accent)}
.task-btn svg{width:14px;height:14px}
#tray{display:flex;align-items:center;gap:14px;padding:0 10px;color:#c6d4e6}
#tray .tray-item{cursor:pointer;padding:4px;border-radius:5px;display:flex;align-items:center;gap:6px;font-size:11.5px}
#tray svg{width:16px;height:16px}
#clock{font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent);padding:4px 8px;border-radius:5px}
#startMenu{position:absolute;bottom:52px;left:10px;width:400px;max-height:600px;background:rgba(5,12,18,.98);backdrop-filter:blur(28px);border:1.5px solid var(--accent-dim);border-radius:16px;z-index:600;display:none;flex-direction:column;overflow:hidden}
#startMenu.open{display:flex}
.start-head{padding:16px 20px;border-bottom:1px solid var(--accent-dim);display:flex;align-items:center;gap:12px}
.start-head .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#22d3ee);display:flex;align-items:center;justify-content:center;font-size:20px;color:#06121c;font-weight:800}
.start-head .nm{font-size:14px;font-weight:700;color:var(--accent)}
.start-head .sub{font-size:10px;color:#6b8fad;letter-spacing:1.5px}
.start-search{margin:12px 16px;padding:10px 14px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:10px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12.5px;outline:none;width:calc(100% - 32px)}
.start-body{flex:1;overflow-y:auto;padding:6px 10px 10px}
.start-cat{font-size:10px;letter-spacing:2.5px;color:#6b8fad;padding:10px 12px 6px;font-weight:700;text-transform:uppercase}
.start-app{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer}
.start-app:hover{background:var(--accent-bg)}
.start-app .ico{width:32px;height:32px;flex-shrink:0}
.start-app .ico svg{width:100%;height:100%}
.start-app .app-nm{font-size:13px;font-weight:600;color:#e6edf7}
.start-app .app-ds{font-size:10.5px;color:#6b8fad;margin-top:2px}
.start-foot{padding:12px 18px;border-top:1px solid var(--accent-dim);display:flex;justify-content:space-between;font-size:10.5px;color:#6b8fad;font-family:'JetBrains Mono',monospace}
.start-foot .btn{padding:6px 12px;border-radius:8px;background:rgba(255,51,85,.15);color:#ff8899;font-size:11px;cursor:pointer;border:1px solid rgba(255,51,85,.3)}
#ctxMenu{position:absolute;z-index:900;background:rgba(5,12,18,.98);border:1px solid var(--accent-dim);border-radius:10px;padding:6px;display:none;min-width:220px}
#ctxMenu.open{display:block}
.ctx-item{padding:9px 14px;font-size:12.5px;color:#c6d4e6;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:10px}
.ctx-item:hover{background:var(--accent-bg);color:var(--accent)}
.ctx-item.danger{color:#ff8899}
.ctx-sep{height:1px;background:var(--accent-dim);margin:5px 8px}
.term-app{background:#000;padding:14px;height:100%;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);line-height:1.55;display:flex;flex-direction:column}
.term-app .line{white-space:pre-wrap;word-break:break-word;margin-bottom:1px}
.term-app .warn{color:#ffcc33}.term-app .err{color:#ff3355}.term-app .info{color:#33ccff}
.term-app .sys{color:#888}.term-app .ok{color:var(--accent);font-weight:700}
.term-app .hl{color:#ffff66;font-weight:700}
.term-log{flex:1;overflow-y:auto}
.term-input{display:flex;gap:8px;align-items:center;padding-top:8px;border-top:1px solid var(--accent-dim);margin-top:8px}
.term-input input{flex:1;background:transparent;border:none;outline:none;color:var(--accent);font-family:inherit;font-size:13px}
.files-app{display:flex;height:100%}
.files-side{width:190px;background:rgba(0,0,0,.4);border-right:1px solid var(--accent-dim);padding:14px 10px;overflow-y:auto}
.files-side .item{padding:9px 12px;border-radius:8px;font-size:12.5px;color:#c6d4e6;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:3px}
.files-side .item:hover{background:var(--accent-bg)}
.files-side .item.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.files-side .item svg{width:16px;height:16px}
.files-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.files-toolbar{display:flex;gap:6px;padding:10px 14px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--accent-dim);flex-wrap:wrap}
.files-toolbar button{padding:7px 14px;border-radius:7px;background:var(--accent-bg);border:1px solid var(--accent-dim);color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.files-toolbar button:disabled{opacity:.35}
.files-path{font-size:11px;color:#6b8fad;font-family:'JetBrains Mono',monospace;margin:0 14px 12px;padding:7px 12px;background:rgba(0,0,0,.3);border-radius:7px;border:1px solid var(--accent-dim)}
.files-content{flex:1;overflow-y:auto;padding:0 14px 14px}
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.file-item{text-align:center;padding:12px 6px;border-radius:10px;cursor:pointer;position:relative}
.file-item:hover{background:var(--accent-bg)}
.file-item .fic{width:52px;height:52px;margin:0 auto 6px;overflow:hidden;border-radius:8px}
.file-item .fic svg{width:100%;height:100%}
.file-item .fic img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.file-item .nm{font-size:11.5px;color:#c6d4e6;word-break:break-word}
.file-empty{text-align:center;color:#6b8fad;padding:60px 20px;font-size:12.5px}
.notepad-app{height:100%;display:flex;flex-direction:column}
.notepad-toolbar{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--accent-dim);background:rgba(0,0,0,.3);flex-wrap:wrap}
.notepad-toolbar button{padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.05);color:#c6d4e6;font-size:11.5px;cursor:pointer;border:1px solid rgba(255,255,255,.08)}
.notepad-toolbar button:hover{background:var(--accent-bg);color:var(--accent)}
.notepad-app textarea{flex:1;background:transparent;border:none;outline:none;color:#e6edf7;font-family:'JetBrains Mono',monospace;font-size:13px;padding:16px;resize:none;line-height:1.65}
.settings-app{padding:22px;height:100%;overflow-y:auto}
.settings-app h3{font-size:15px;color:var(--accent);margin-bottom:18px;font-family:'JetBrains Mono',monospace}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(0,0,0,.3);border:1px solid var(--accent-dim);border-radius:10px;margin-bottom:10px;gap:14px}
.setting-row .lbl{font-size:12.5px;color:#e6edf7}
.setting-row .desc{font-size:10.5px;color:#6b8fad;margin-top:2px}
.setting-row select,.setting-row input[type=text]{padding:7px 12px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:7px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12px;outline:none}
.setting-row input[type=color]{width:60px;height:36px;padding:0;border:1px solid var(--accent-dim);border-radius:8px;background:transparent;cursor:pointer}
.setting-row input[type=range]{accent-color:var(--accent);width:140px}
.toggle{width:46px;height:26px;background:rgba(255,255,255,.1);border-radius:13px;position:relative;cursor:pointer;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{left:22px}
.browser-app{height:100%;display:flex;flex-direction:column}
.browser-tabs-row{display:flex;gap:2px;padding:6px 8px 0;background:rgba(0,0,0,.5);border-bottom:1px solid var(--accent-dim)}
.browser-tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px 8px 0 0;font-size:11.5px;background:var(--accent-bg);color:var(--accent);font-family:'JetBrains Mono',monospace;border:1px solid var(--accent-dim);border-bottom:none}
.browser-bar{padding:8px 10px;background:rgba(0,0,0,.4);border-bottom:1px solid var(--accent-dim);display:flex;gap:8px;align-items:center}
.browser-nav-btn{width:32px;height:32px;border-radius:8px;background:transparent;border:1px solid transparent;color:#c6d4e6;cursor:pointer;display:flex;align-items:center;justify-content:center}
.browser-nav-btn:hover{background:var(--accent-bg);color:var(--accent)}
.browser-nav-btn svg{width:16px;height:16px}
.browser-url{flex:1;display:flex;align-items:center;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:8px;padding:0 12px;height:36px;gap:8px}
.browser-url input{flex:1;background:transparent;border:none;outline:none;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12.5px}
.browser-go{padding:8px 16px;background:var(--accent);color:#06121c;border:none;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
.browser-content{flex:1;position:relative;background:#fff}
.browser-content iframe{width:100%;height:100%;border:none;background:#fff}
.browser-home{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:40px;text-align:center;background:linear-gradient(135deg,#0a0e1a,#1a0e28);color:#e6edf7;overflow-y:auto}
.browser-home h2{color:var(--accent);font-family:'JetBrains Mono',monospace;letter-spacing:3px;font-size:22px;margin-bottom:12px}
.browser-home p{color:#8fa3c0;font-size:13px;margin-bottom:28px;max-width:420px}
.browser-shortcuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;max-width:600px;width:100%}
.browser-shortcut{background:rgba(255,255,255,.04);border:1px solid var(--accent-dim);border-radius:12px;padding:16px 10px;cursor:pointer;text-align:center}
.browser-shortcut:hover{background:var(--accent-bg);transform:translateY(-3px)}
.browser-shortcut .si{width:38px;height:38px;margin:0 auto 8px;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center}
.browser-shortcut .si svg{width:100%;height:100%}
.browser-shortcut .sn{font-size:11.5px;font-weight:600;color:#e6edf7}
.music-app{display:flex;flex-direction:column;height:100%;padding:20px;gap:16px}
.music-viz{height:160px;background:rgba(0,0,0,.4);border:1px solid var(--accent-dim);border-radius:14px;display:flex;align-items:flex-end;padding:12px;gap:3px}
.music-viz .bar{flex:1;background:linear-gradient(180deg,#22d3ee,var(--accent));border-radius:2px 2px 0 0;min-height:3px}
.music-ctrl{display:flex;align-items:center;justify-content:center;gap:16px}
.music-ctrl button{width:48px;height:48px;border-radius:50%;background:var(--accent-bg);border:1.5px solid var(--accent-dim);color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.music-ctrl button.play{width:64px;height:64px;background:var(--accent);color:#06121c}
.music-list{flex:1;overflow-y:auto;background:rgba(0,0,0,.3);border:1px solid var(--accent-dim);border-radius:12px;padding:10px}
.music-item{padding:10px 14px;border-radius:8px;font-size:12.5px;color:#c6d4e6;cursor:pointer;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace}
.music-item.playing{background:var(--accent-bg);color:var(--accent);font-weight:700}
.clock-app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px;font-family:'JetBrains Mono',monospace}
.clock-app .big{font-size:72px;font-weight:800;color:var(--accent);letter-spacing:-3px;text-shadow:0 0 40px var(--accent-glow);line-height:1}
.clock-app .date{margin-top:14px;font-size:17px;color:#22d3ee;letter-spacing:2px}
.calc-app{display:flex;flex-direction:column;height:100%;padding:16px;gap:12px}
.calc-display{background:rgba(0,0,0,.5);border:1.5px solid var(--accent-dim);border-radius:12px;padding:20px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;color:var(--accent);min-height:90px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-display .prev{font-size:14px;color:#6b8fad;min-height:20px}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;flex:1}
.calc-btn{background:rgba(255,255,255,.04);border:1px solid var(--accent-dim);border-radius:10px;font-size:19px;font-weight:600;color:#e6edf7;cursor:pointer;font-family:'JetBrains Mono',monospace}
.calc-btn:hover{background:var(--accent-bg)}
.calc-btn.op{color:#22d3ee;background:rgba(34,211,238,.08)}
.calc-btn.eq{background:var(--accent);color:#06121c;border-color:var(--accent)}
.calc-btn.clr{color:#ff8899;background:rgba(255,51,85,.1)}
.preview-app{height:100%;display:flex;flex-direction:column;background:#0a0e1a}
.preview-toolbar{display:flex;gap:6px;padding:8px 12px;background:rgba(0,0,0,.4);border-bottom:1px solid var(--accent-dim);align-items:center;flex-wrap:wrap}
.preview-toolbar button{padding:7px 12px;border-radius:7px;background:var(--accent-bg);border:1px solid var(--accent-dim);color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer}
.preview-toolbar .spacer{flex:1}
.preview-toolbar .filename{font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b8fad;padding:5px 12px;background:rgba(0,0,0,.4);border-radius:7px;border:1px solid var(--accent-dim)}
.preview-toolbar .toggle-view{padding:6px 10px;font-size:10.5px}
.preview-toolbar .toggle-view.active{background:var(--accent);color:#06121c}
.preview-split{flex:1;display:flex;overflow:hidden}
.preview-pane{flex:1;display:flex;flex-direction:column;min-width:0}
.preview-pane+.preview-pane{border-left:1px solid var(--accent-dim)}
.preview-pane-head{font-size:10.5px;letter-spacing:2px;color:#6b8fad;padding:7px 12px;background:rgba(0,0,0,.3);border-bottom:1px solid var(--accent-dim);font-family:'JetBrains Mono',monospace;display:flex;justify-content:space-between}
.preview-code{flex:1;position:relative;overflow:hidden}
.preview-code textarea{position:absolute;inset:0;width:100%;height:100%;background:#000;border:none;outline:none;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.55;padding:16px;resize:none;white-space:pre}
.preview-frame{flex:1;background:#fff;border:none;width:100%;height:100%}
.preview-split.code-only .preview-right{display:none}
.preview-split.preview-only .preview-left{display:none}
.preview-resizer{width:6px;background:rgba(0,0,0,.3);cursor:col-resize;flex-shrink:0}
.store-app{height:100%;display:flex;flex-direction:column}
.store-head{padding:18px 22px;border-bottom:1px solid var(--accent-dim);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(180deg,var(--accent-bg),transparent)}
.store-head h2{font-size:20px;color:var(--accent);letter-spacing:2px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:12px}
.store-search{padding:9px 16px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:10px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:12.5px;outline:none;min-width:240px}
.store-tabs{display:flex;gap:4px;padding:12px 22px;border-bottom:1px solid var(--accent-dim);overflow-x:auto}
.store-tab{padding:8px 18px;border-radius:9px;font-size:12px;color:#c6d4e6;cursor:pointer;white-space:nowrap;font-weight:600;border:1px solid transparent;font-family:'JetBrains Mono',monospace}
.store-tab.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-dim)}
.store-body{flex:1;overflow-y:auto;padding:22px}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.store-card{background:linear-gradient(135deg,rgba(20,30,45,.7),rgba(10,16,26,.7));border:1px solid var(--accent-dim);border-radius:14px;padding:18px;transition:.2s;display:flex;flex-direction:column;gap:12px}
.store-card:hover{border-color:var(--accent-glow);transform:translateY(-3px)}
.store-card .top{display:flex;gap:14px;align-items:flex-start}
.store-card .app-ico{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent-bg);flex-shrink:0;border:1px solid var(--accent-dim);padding:10px}
.store-card .app-ico svg{width:100%;height:100%}
.store-card .app-nm{font-size:14.5px;font-weight:700;color:#e6edf7;margin-bottom:4px}
.store-card .app-ds{font-size:11.5px;color:#8fa3c0;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.store-card .app-stats{display:flex;gap:10px;font-size:10.5px;color:#6b8fad;font-family:'JetBrains Mono',monospace}
.store-card .app-stats .star{color:#facc15}
.store-card .actions{display:flex;gap:8px;margin-top:auto}
.store-card .actions button{flex:1;padding:10px 16px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;letter-spacing:1px;border:none}
.store-card .actions .install{background:var(--accent);color:#06121c}
.store-card .actions .open-btn{background:transparent;color:var(--accent);border:1px solid var(--accent-dim)}
.store-card .actions .uninstall{background:rgba(255,51,85,.15);color:#ff8899;border:1px solid rgba(255,51,85,.3)}
.store-card.installed{border-color:var(--accent-glow)}
#notifArea{position:absolute;bottom:56px;right:12px;z-index:650;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notif{background:rgba(5,12,18,.98);border:1.5px solid var(--accent-dim);border-radius:12px;padding:14px 18px;min-width:290px;max-width:380px;display:flex;gap:12px;align-items:flex-start;animation:notifIn .3s;pointer-events:auto}
@keyframes notifIn{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:translateX(0)}}
.notif.out{animation:notifOut .3s forwards}
@keyframes notifOut{to{opacity:0;transform:translateX(120%)}}
.notif svg{width:24px;height:24px;flex-shrink:0;color:var(--accent)}
.notif .ttl{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:3px;font-family:'JetBrains Mono',monospace}
.notif .msg{font-size:11.5px;color:#c6d4e6;line-height:1.45}
.notif.warn{border-color:#ffcc33}.notif.warn svg,.notif.warn .ttl{color:#ffcc33}
.notif.err{border-color:#ff3355}.notif.err svg,.notif.err .ttl{color:#ff3355}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:1500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:rgba(10,16,26,.98);border:1.5px solid var(--accent-dim);border-radius:14px;padding:26px;max-width:400px;width:100%}
.modal h3{font-size:15px;color:var(--accent);margin-bottom:16px;font-family:'JetBrains Mono',monospace}
.modal input{width:100%;padding:11px 14px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:9px;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;margin-bottom:18px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end}
.modal button{padding:10px 22px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;border:none}
.modal .ok{background:var(--accent);color:#06121c}
.modal .cancel{background:transparent;border:1px solid var(--accent-dim);color:#c6d4e6}
#shutdown{position:fixed;inset:0;background:#000;z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:'JetBrains Mono',monospace;color:var(--accent)}
#shutdown.on{display:flex}
#shutdown .btn{margin-top:20px;padding:14px 32px;background:var(--accent-bg);border:1.5px solid var(--accent);color:var(--accent);border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
</style>

let winZ=100,winId=0;
const windows={};
function openApp(appKey,arg){
for(const[id,w]of Object.entries(windows)){
if(w.appKey===appKey){
if(w.el.classList.contains("minimized"))w.el.classList.remove("minimized");
focusWin(id);Audio.open();
if(arg&&appKey==="preview"){const ta=w.el.querySelector(".preview-code textarea");if(ta){ta.value=arg.content||"";ta.dataset.path=arg.path||"";}setTimeout(()=>w.el.querySelector("[data-refresh-preview]")?.click(),50);}

return;
}}
let app;
if(APPS[appKey])app=APPS[appKey];
else if(STORE_APPS[appKey]&&InstalledApps.has(appKey)){const s=STORE_APPS[appKey];app={name:s.name,icon:s.icon,width:900,height:640,render:s.render};}
if(!app)return;
const id="w"+(++winId);
const el=document.createElement("div");
el.className="win";el.dataset.id=id;
const offset=(Object.keys(windows).length%6)*26;
const w=app.width||600,h=app.height||440;
const x=Math.max(20,(innerWidth-w)/2+offset-80);
const y=Math.max(20,(innerHeight-h-60)/2+offset-80);
el.style.left=x+"px";el.style.top=y+"px";
el.style.width=w+"px";el.style.height=h+"px";
el.innerHTML=`<div class="win-title"><span class="ic">${iconHTML(app.icon)}</span><span class="ttl">${app.name}</span><div class="win-btns"><button class="win-btn min">─</button><button class="win-btn max">▢</button><button class="win-btn close">✕</button></div></div><div class="win-body"></div><div class="win-resize"></div>`;
document.getElementById("desktop").appendChild(el);
const body=el.querySelector(".win-body");
try{app.render(body,id,arg);}catch(e){body.innerHTML=`<div style="padding:20px;color:#ff3355">Hata: ${e.message}</div>`;}
windows[id]={el,appKey,app};
wireWindow(id,el);
focusWin(id);updateTasks();Audio.open();
}
function wireWindow(id,el){
const title=el.querySelector(".win-title");
const btnClose=el.querySelector(".close"),btnMin=el.querySelector(".min"),btnMax=el.querySelector(".max");
const resize=el.querySelector(".win-resize");
let drag=false,sx,sy,ox,oy;
title.addEventListener("mousedown",e=>{if(e.target.closest(".win-btn"))return;if(el.classList.contains("maximized"))return;drag=true;sx=e.clientX;sy=e.clientY;ox=parseInt(el.style.left);oy=parseInt(el.style.top);focusWin(id);e.preventDefault();});
document.addEventListener("mousemove",e=>{if(!drag)return;el.style.left=(ox+e.clientX-sx)+"px";el.style.top=(oy+e.clientY-sy)+"px";});
document.addEventListener("mouseup",()=>drag=false);
let rs=false,rx,ry,rw,rh;
resize.addEventListener("mousedown",e=>{rs=true;rx=e.clientX;ry=e.clientY;rw=parseInt(el.style.width);rh=parseInt(el.style.height);focusWin(id);e.preventDefault();e.stopPropagation();});
document.addEventListener("mousemove",e=>{if(!rs)return;el.style.width=Math.max(280,rw+e.clientX-rx)+"px";el.style.height=Math.max(180,rh+e.clientY-ry)+"px";});
document.addEventListener("mouseup",()=>rs=false);
btnClose.onclick=e=>{e.stopPropagation();closeWin(id);};
btnMin.onclick=e=>{e.stopPropagation();el.classList.add("minimized");updateTasks();Audio.close();};
btnMax.onclick=e=>{e.stopPropagation();el.classList.toggle("maximized");Audio.click();};
el.addEventListener("mousedown",()=>focusWin(id));
}
function focusWin(id){for(const[k,w]of Object.entries(windows))w.el.classList.toggle("focused",k===id);if(windows[id])windows[id].el.style.zIndex=++winZ;updateTasks();}
function closeWin(id){const w=windows[id];if(!w)return;w.el.style.opacity="0";w.el.style.transform="scale(.95)";w.el.style.transition=".15s";setTimeout(()=>{w.el.remove();delete windows[id];updateTasks();},150);Audio.close();}
function updateTasks(){const c=document.getElementById("tasks");c.innerHTML="";for(const[id,w]of Object.entries(windows)){const b=document.createElement("div");b.className="task-btn"+(w.el.classList.contains("minimized")?"":" active");b.innerHTML=`${iconHTML(w.app.icon)}<span class="nm">${w.app.name}</span>`;b.onclick=()=>{if(w.el.classList.contains("minimized")){w.el.classList.remove("minimized");focusWin(id);}else if(w.el.classList.contains("focused")){w.el.classList.add("minimized");updateTasks();Audio.close();}else focusWin(id);Audio.click();};c.appendChild(b);}}

function renderMusic(body,id){
const tracks=[{n:"Derin Uzay",f:[55,110,165]},{n:"Yağmur",f:[0]},{n:"Matrix Hum",f:[80,120]},{n:"Neon Şehir",f:[220,330,440]},{n:"Sessizlik",f:null}];
let playing=false,cur=0,oscs=[],tickIv=null,noiseSrc=null;
body.innerHTML=`<div class="music-app"><div class="music-viz" id="mv${id}"></div><div class="music-ctrl"><button data-a="prev">${SVG.ui.prev}</button><button data-a="play" class="play">${SVG.ui.play}</button><button data-a="next">${SVG.ui.next}</button></div><div class="music-list" id="ml${id}"></div></div>`;
const viz=body.querySelector(`#mv${id}`),list=body.querySelector(`#ml${id}`),playBtn=body.querySelector('[data-a="play"]');
for(let i=0;i<24;i++){const b=document.createElement("div");b.className="bar";b.style.height="3px";viz.appendChild(b);}
function renderList(){list.innerHTML=tracks.map((t,i)=>`<div class="music-item${i===cur?" playing":""}" data-i="${i}"><span>${i===cur&&playing?"▶ ":"   "}${t.n}</span></div>`).join("");list.querySelectorAll(".music-item").forEach(el=>el.onclick=()=>{cur=+el.dataset.i;if(playing){stop();setTimeout(play,50);}else renderList();});}
function stop(){oscs.forEach(({o,g})=>{try{o.stop();o.disconnect();g.disconnect();}catch(e){}});oscs=[];if(noiseSrc){try{noiseSrc.stop();noiseSrc.disconnect();}catch(e){}noiseSrc=null;}clearInterval(tickIv);viz.querySelectorAll(".bar").forEach(b=>b.style.height="3px");}
function play(){Audio.init();Audio.resume();if(!Audio.ctx)return notify("Ses","Desteklemiyor","err");stop();const t=tracks[cur];if(t.f&&t.f[0]>0){t.f.forEach((freq,i)=>{const o=Audio.ctx.createOscillator(),g=Audio.ctx.createGain();o.frequency.value=freq;o.type=i===0?"sine":"triangle";g.gain.value=0.12;o.connect(g).connect(Audio.master);o.start();oscs.push({o,g});});}else if(t.n.includes("Yağmur")){const bs=Audio.ctx.sampleRate*2;const buf=Audio.ctx.createBuffer(1,bs,Audio.ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<bs;i++)d[i]=Math.random()*2-1;const src=Audio.ctx.createBufferSource();src.buffer=buf;src.loop=true;const lp=Audio.ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=4000;const g=Audio.ctx.createGain();g.gain.value=0.15;src.connect(lp).connect(g).connect(Audio.master);src.start();noiseSrc=src;}playing=true;playBtn.innerHTML=SVG.ui.pause;tickIv=setInterval(()=>{viz.querySelectorAll(".bar").forEach(b=>{b.style.height=(Math.random()*60+10)+"px";});},120);renderList();}
body.querySelectorAll(".music-ctrl button").forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a==="play"){if(playing){stop();playing=false;playBtn.innerHTML=SVG.ui.play;renderList();}else play();}else if(a==="next"){cur=(cur+1)%tracks.length;if(playing){stop();setTimeout(play,50);}else renderList();}else if(a==="prev"){cur=(cur-1+tracks.length)%tracks.length;if(playing){stop();setTimeout(play,50);}else renderList();}});
renderList();
}

function renderCalc(body,id){

function renderMultiNotes(body,id){let notes=JSON.parse(localStorage.getItem("app_notes")||"[]");if(!notes.length)notes=[{title:"İlk not",body:"Merhaba!",color:"#33ff66"}];let cur=0;body.innerHTML=`<div style="display:flex;height:100%"><div style="width:170px;background:rgba(0,0,0,.4);border-right:1px solid var(--accent-dim);display:flex;flex-direction:column"><button id="nn${id}" style="margin:10px;padding:9px;background:var(--accent);color:#06121c;border:none;border-radius:8px;font-weight:700;cursor:pointer">+ Yeni</button><div id="nl${id}" style="flex:1;overflow-y:auto;padding:6px"></div></div><div style="flex:1;display:flex;flex-direction:column"><input id="nt${id}" placeholder="Başlık" style="padding:14px;background:transparent;border:none;border-bottom:1px solid var(--accent-dim);color:var(--accent);font-size:15px;font-weight:700;outline:none"><textarea id="nb${id}" placeholder="İçerik..." style="flex:1;background:transparent;border:none;padding:16px;color:#e6edf7;outline:none;resize:none;line-height:1.65"></textarea></div></div>`;const nl=body.querySelector(`#nl${id}`),nt=body.querySelector(`#nt${id}`),nb=body.querySelector(`#nb${id}`);function save(){localStorage.setItem("app_notes",JSON.stringify(notes));}function renderList(){nl.innerHTML=notes.map((n,i)=>`<div data-i="${i}" style="padding:10px;border-radius:8px;cursor:pointer;margin-bottom:3px;font-size:12.5px;color:${i===cur?'var(--accent)':'#c6d4e6'};background:${i===cur?'var(--accent-bg)':'transparent'};border-left:3px solid ${n.color};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.title)||"İsimsiz"}</div>`).join("");nl.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{cur=+el.dataset.i;load();renderList();});}function load(){if(!notes[cur]){nt.value="";nb.value="";return;}nt.value=notes[cur].title||"";nb.value=notes[cur].body||"";}nt.oninput=()=>{if(notes[cur]){notes[cur].title=nt.value;save();renderList();}};nb.oninput=()=>{if(notes[cur])notes[cur].body=nb.value;save();};bo function renderPaint(body,id){const size=32;let px=Array(size*size).fill(0);let drawing=false;body.innerHTML=`<div style="height:100%;display:flex;flex-direction:column;padding:14px;gap:10px"><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="color" id="pc${id}" value="#33ff66" style="width:44px;height:36px;border-radius:8px;cursor:pointer"><button id="erase${id}" style="padding:8px 14px;background:rgba(255,51,85,.15);color:#ff8899;border:1px solid rgba(255,51,85,.3);border-radius:8px;cursor:pointer">Silgi</button><button id="clear${id}" style="padding:8px 14px;background:rgba(255,51,85,.15);color:#ff8899;border:1px solid rgba(255,51,85,.3);border-radius:8px;cursor:pointer">Temizle</button><button id="save${id}" style="padding:8px 14px;background:var(--accent);color:#06121c;border:none;border-radius:8px;font-weight:700;cursor:pointer">💾 PNG → Dosyalar</button></div><div id="grid${id}" style="flex:1;display:grid;grid-template-columns:repeat(${size},1fr);gap:1px;background:rgba(0,0,0,.4);padding:6px;border-radius:10px;border:1px solid var(--accent-dim);aspect-ratio:1;max-width:100%;align-self:center"></div></div>`;const grid=body.querySelector(`#grid${id}`);for(let i=0;i<size*size;i++){const d=document.createElement("div");d.style.cssText="aspect-ratio:1;background:#0a0e1a;cursor:pointer;border-radius:2px";d.dataset.i=i;d.onmousedown=()=>{drawing=true;setPixel(i);};d.onmouseenter=()=>{if(drawing)setPixel(i);};grid.appendChild(d);}document.addEventListener("mouseup",()=>drawing=false);function setPixel(i){const ue=body.querySelector(`#erase${id}`).classList.contains("active");const c=ue?"#0a0e1a":body.querySelector(`#pc${id}`).value;px[i]=ue?"":c;grid.children[i].style.background=c;}body.querySelector(`#erase${id}`).onclick=e=>{e.target.classList.toggle("active");e.target.style.background=e.target.classList.contains("active")?"var(--accent)":"";e.target.style.color=e.target.classList.contains("active")?"#06121c":"";};body.querySelector(`#clear${id}`).onclick=()=>{for(let i=0;i<size*size;i++){px[i]="";grid.children[i].style.background="#0a0e1a";}};body.querySelector(`#save${id}`).onclick=async()=>{const cv=document.createElement("canvas");cv.width=size;cv.height=size;const cx=cv.getContext("2d");cx.fillStyle="#0a0e1a";cx.fillRect(0,0,size,size);for(let i=0;i<size*size;i++){if(px[i]){cx.fillStyle=px[i];cx.fillRect(i%size,Math.floor(i/size),1,1);}}const big=document.createElement("canvas");big.width=size*16;big.height=size*16;const bx=big.getContext("2d");bx.imageSmoothingEnabled=false;bx.drawImage(cv,0,0,big.width,big.height);const data=big.toDataURL("image/png");const n=await promptModal("Dosya adı:","pixelart_"+Date.now()+".png");if(!n)return;const fn=n.match(/\.png$/i)?n:n+".png";const r=FileSystem.touch("/home/root/"+fn,data);if(!r.ok)return notify("Hata",r.err,"err");notify("Kaydedildi",fn+" → Dosyalar","ok");refreshAllFiles();};}
function renderQR(body,id){body.innerHTML=`<div style="padding:20px;height:100%;display:flex;flex-direction:column;gap:14px;align-items:center"><h3 style="color:var(--accent);font-family:monospace">📱 QR Üretici</h3><input type="text" id="qi${id}" value="https://example.com" style="width:100%;padding:12px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:10px;color:var(--accent);outline:none"><button id="qg${id}" style="padding:11px 26px;background:var(--accent);color:#06121c;border:none;border-radius:10px;font-weight:700;cursor:pointer">Oluştur</button><div id="qr${id}" style="background:#fff;padding:20px;border-radius:14px;min-width:240px;min-height:240px;display:flex;align-items:center;justify-content:center"></div><button id="qd${id}" style="padding:9px 20px;background:var(--accent);color:#06121c;border:none;border-radius:10px;font-weight:700;cursor:pointer">💾 Kaydet → Dosyalar</button></div>`;function gen(text){const qr=body.querySelector(`#qr${id}`);qr.innerHTML="";const sz=25,cell=10;const cv=document.createElement("canvas");cv.width=sz*cell;cv.height=sz*cell;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle="#000";let h=0;for(const c of text)h=(h*31+c.charCodeAt(0))>>>0;for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){const isF=(x<7&&y<7)||(x>sz-8&&y<7)||(x<7&&y>sz-8);let v;if(isF){const lx=x<7?x:x-(sz-7),ly=y<7?y:y-(sz-7);v=(lx===0||lx===6||ly===0||ly===6)||(lx>=2&&lx<=4&&ly>=2&&ly<=4);}else{h=(h*1103515245+12345)>>>0;v=(h>>>16)&1;}if(v)cx.fillRect(x*cell,y*cell,cell,cell);}qr.appendChild(cv);}body.querySelector(`#qg${id}`).onclick=()=>{const v=body.querySelector(`#qi${id}`).value.trim();if(!v)return;gen(v);Audio.ok();};body.querySelector(`#qd${id}`).onclick=async()=>{const cv=body.querySelector(`#qr${id} canvas`);if(!cv)return;const data=cv.toDataURL("image/png");const n=await promptModal("Dosya adı:","qr_"+Date.now()+".png");if(!n)return;const fn=n.match(/\.png$/i)?n:n+".png";const r=FileSystem.touch("/home/root/"+fn,data);if(!r.ok)return notify("Hata",r.err,"err");notify("Kaydedildi",fn,"ok");refreshAllFiles();};gen("https://example.com");}
function renderSynth(body,id){const notes={a:261.63,s:293.66,d:329.63,f:349.23,g:392,h:440,j:493.88,k:523.25,q:523.25,w:587.33,e:659.25,r:698.46,t:783.99,y:880,u:987.77,i:1046.50};body.innerHTML=`<div style="padding:20px;height:100%;display:flex;flex-direction:column;gap:14px;align-items:center"><h3 style="color:var(--accent);font-family:monospace">🎹 Synth</h3><div style="display:flex;gap:14px"><select id="wt${id}" style="padding:9px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:8px;color:var(--accent)"><option value="sine">Sinüs</option><option value="square">Kare</option><option value="triangle">Üçgen</option><option value="sawtooth">Testere</option></select><label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:#c6d4e6">Süre <input type="range" id="wt2${id}" min="0.1" max="2" value="0.5" step="0.1"></label></div><div id="k${id}" style="display:grid;grid-template-columns:repeat(8,1fr);gap:5px;width:100%;max-width:520px"></div><div style="font-size:11.5px;color:#6b8fad">Klavye: A S D F G H J K</div></div>`;const keys=body.querySelector(`#k${id}`);[...`qwertyui`].forEach(k=>{const b=document.createElement("button");b.textContent=k.toUpperCase();b.style.cssText="padding:14px 4px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);color:#c6d4e6;border-radius:6px;font-weight:700;cursor:pointer;font-size:11px";b.onmousedown=()=>playNote(notes[k]);keys.appendChild(b);});[...`asdfghjk`].forEach(k=>{const b=document.createElement("button");b.textContent=k.toUpperCase();b.style.cssText="padding:22px 4px;background:var(--accent-bg);border:1px solid var(--accent-dim);color:var(--accent);border-radius:6px;font-weight:700;cursor:pointer";b.onmousedown=()=>playNote(notes[k]);keys.appendChild(b);});function playNote(freq){if(!freq)return;Audio.init();Audio.resume();if(!Audio.ctx)return;const o=Audio.ctx.createOscillator(),g=Audio.ctx.createGain();o.frequency.value=freq;o.type=body.querySelector(`#wt${id}`).value;const dur=+body.querySelector(`#wt2${id}`).value;const t=Audio.ctx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.3,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(Audio.master);o.start(t);o.stop(t+dur+0.05);}const kh=e=>{if(!document.contains(body))return document.removeEventListener("keydown",kh);const win=body.closest(".win");if(!win||!win.classList.contains("focused"))return;if(e.repeat)return;const k=e.key.toLowerCase();if(notes[k])playNote(notes[k]);};document.addEventListener("keydown",kh);}

function renderChat(body,id){let msgs=JSON.parse(localStorage.getItem("app_chat")||"[]");if(!msgs.length)msgs=[{from:"bot",text:"Merhaba! 🤖"}];body.innerHTML=`<div style="height:100%;display:flex;flex-direction:column;background:#0a0e1a"><div style="padding:12px;border-bottom:1px solid var(--accent-dim);display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:20px">🤖</div><div style="font-weight:700;color:var(--accent)">SimChat</div></div><div id="msgs${id}" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px"></div><div style="padding:12px;border-top:1px solid var(--accent-dim);display:flex;gap:8px"><input id="inp${id}" placeholder="Mesaj..." style="flex:1;padding:11px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:10px;color:var(--accent);outline:none"><button id="snd${id}" style="padding:11px 18px;background:var(--accent);color:#06121c;border:none;border-radius:10px;font-weight:700;cursor:pointer">Gönder</button></div></div>`;const msgsEl=body.querySelector(`#msgs${id}`),inp=body.querySelector(`#inp${id}`);function render(){msgsEl.innerHTML=msgs.map(m=>`<div style="display:flex;${m.from==="user"?"flex-direction:row-reverse":""};gap:8px"><div style="width:28px;height:28px;border-radius:50%;background:${m.from==="user"?"var(--accent)":"linear-gradient(135deg,#22d3ee,#a78bfa)"};display:flex;align-items:center;justify-content:center">${m.from==="user"?"👤":"🤖"}</div><div style="max-width:70%;padding:10px 14px;border-radius:14px;background:${m.from==="user"?"var(--accent)":"rgba(255,255,255,.06)"};color:${m.from==="user"?"#06121c":"#e6edf7"};font-size:13px;white-space:pre-wrap">${esc(m.text)}</div></div>`).join("");msgsEl.scrollTop=msgsEl.scrollHeight;}function reply(t){t=t.toLowerCase();const r=[{k:["merhaba","selam"],a:["Merhaba!","Selam!"]},{k:["nasılsın"],a:["İyiyim!"]},{k:["saat"],a:[`Saat: ${new Date().toLocaleTimeString("tr-TR")}`]}];for(const x of r)if(x.k.some(k=>t.includes(k)))return x.a[Math.floor(Math.random()*x.a.length)];return ["İlginç!","Devam et.","Anlıyorum."][Math.floor(Math.random()*3)];}function send(){const v=inp.value.trim();if(!v)return;msgs.push({from:"user",text:v});inp.value="";render();localStorage.setItem("app_chat",JSON.stringify(msgs));setTimeout(()=>{msgs.push({from:"bot",text:reply(v)});render();localStorage.setItem("app_chat",JSON.stringify(msgs));},600);}body.querySelector(`#snd${id}`).onclick=send;inp.addEventListener("keydown",e=>{if(e.key==="Enter")send();});render();}
function renderPomodoro(body,id){let left=25*60,running=false,iv=null;body.innerHTML=`<div style="padding:24px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px"><div id="md${id}" style="font-family:monospace;font-size:14px;letter-spacing:4px;color:#ff3355;font-weight:700">ÇALIŞMA</div><div id="tp${id}" style="font-size:80px;font-weight:800;color:var(--accent);font-family:monospace">25:00</div><button id="st${id}" style="padding:12px 28px;background:var(--accent);color:#06121c;border:none;border-radius:10px;font-weight:700;cursor:pointer">▶ Başlat</button></div>`;const tp=body.querySelector(`#tp${id}`),md=body.querySelector(`#md${id}`);function fmt(s){return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;}function upd(){tp.textContent=fmt(left);}body.querySelector(`#st${id}`).onclick=e=>{if(running){clearInterval(iv);running=false;e.target.textContent="▶ Devam";}else{running=true;e.target.textContent="⏸ Duraklat";iv=setInterval(()=>{left--;if(left<=0){clearInterval(iv);running=false;if(md.textContent==="ÇALIŞMA"){md.textContent="MOLA";md.style.color="#4ade80";left=5*60;}else{md.textContent="ÇALIŞMA";md.style.color="#ff3355";left=25*60;}e.target.textContent="▶ Başlat";}upd();},1000);}};upd();}
function renderSifre(body,id){body.innerHTML=`<div style="padding:20px;height:100%;display:flex;flex-direction:column;gap:12px"><h3 style="color:var(--accent);font-family:monospace">🔐 Şifre Kasası</h3><input type="text" id="in${id}" readonly style="padding:11px;background:rgba(0,0,0,.5);border:1px solid var(--accent-dim);border-radius:10px;color:var(--accent);font-family:monospace;outline:none"><button id="gn${id}" style="padding:11px 18px;background:var(--accent);color:#06121c;border:none;border-radius:10px;font-weight:700;cursor:pointer">Üret</button></div>`;body.querySelector(`#gn${id}`).onclick=()=>{const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*";let p="";for(let i=0;i<16;i++)p+=chars[Math.floor(Math.random()*chars.length)];body.querySelector(`#in${id}`).value=p;navigator.clipboard?.writeText(p);notify("Kopyalandı","","ok");};}
function renderTakvim(body,id){const months=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];let date=new Date(),year=date.getFullYear(),month=date.getMonth();body.innerHTML=`<div style="padding:20px;height:100%;display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between"><button id="pv${id}" style="padding:8px 14px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-dim);border-radius:8px;cursor:pointer">←</button><div id="tt${id}" style="font-size:20px;font-weight:800;color:var(--accent);font-family:monospace"></div><button id="nx${id}" style="padding:8px 14px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-dim);border-radius:8px;cursor:pointer">→</button></div><div id="gr${id}" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div></div>`;function render(){body.querySelector(`#tt${id}`).textContent=`${months[month]} ${year}`;const gr=body.querySelector(`#gr${id}`);const first=new Date(year,month,1);let startDay=(first.getDay()+6)%7;const dim=new Date(year,month+1,0).getDate();const today=new Date();let html="";for(let i=0;i<startDay;i++)html+=`<div></div>`;for(let d=1;d<=dim;d++){const isT=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();html+=`<div style="aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-family:monospace;background:${isT?"var(--accent)":"rgba(255,255,255,.04)"};color:${isT?"#06121c":"#e6edf7"}">${d}</div>`;}gr.innerHTML=html;}body.querySelector(`#pv${id}`).onclick=()=>{month--;if(month<0){month=11;year--;}render();};body.querySelector(`#nx${id}`).onclick=()=>{month++;if(month>11){month=0;year++;}render();};render();}
function renderDunyaSaati(body,id){const cities=[{n:"İstanbul",tz:3,flag:"🇹🇷"},{n:"Londra",tz:0,flag:"🇬🇧"},{n:"New York",tz:-5,flag:"🇺🇸"},{n:"Tokyo",tz:9,flag:"🇯🇵"},{n:"Moskova",tz:3,flag:"🇷🇺"}];body.innerHTML=`<div style="padding:22px;height:100%;display:flex;flex-direction:column;gap:12px"><h3 style="color:var(--accent);font-family:monospace">🌍 Dünya Saati</h3><div id="list${id}" style="flex:1;display:flex;flex-direction:column;gap:10px"></div></div>`;const list=body.querySelector(`#list${id}`);function upd(){const now=new Date();const utc=now.getTime()+now.getTimezoneOffset()*60000;list.innerHTML=cities.map(c=>{const t=new Date(utc+c.tz*3600000);return `<div style="padding:14px 18px;background:rgba(0,0,0,.3);border:1px solid var(--accent-dim);border-radius:12px;display:flex;justify-content:space-between"><div style="display:flex;gap:12px"><span style="font-size:26px">${c.flag}</span><div><div style="font-weight:700">${c.n}</div></div></div><div style="font-family:monospace;font-size:22px;color:var(--accent);font-weight:700">${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}</div></div>`;}).join("");}upd();setInterval(upd,1000);}

async function boot(){
const lines=["[ OK ] Kernel yükleniyor...","[ OK ] SVG motoru aktif.","[ OK ] Tarayıcı hazır.","[ OK ] Dosya sistemi bağlanıyor...","[ OK ] 15+ uygulama mağazada.","[ OK ] Hazır."];
const bl=document.getElementById("bootLines");
for(let i=0;i<lines.length;i++){await new Promise(r=>setTimeout(r,220));bl.innerHTML+=lines[i]+"<br>";document.getElementById("bootMsg").textContent=lines[i].replace("[ OK ] ","");}
await new Promise(r=>setTimeout(r,400));
document.getElementById("boot").classList.add("off");
setTimeout(()=>document.getElementById("boot").remove(),900);
notify("GölgeOS",`Hoş geldin, ${Settings.data.userName}. v3.2!`,"ok");
setTimeout(()=>notify("Temiz","🎮 Oyunlar kaldırıldı — sadece faydalı uygulamalar","info"),2500);
}
renderDesktopIcons();
document.getElementById("shutdownBtn").onclick=()=>{document.getElementById("startMenu").classList.remove("open");if(confirm("Sistemi kapat?")){document.getElementById("shutdown").classList.add("on");Audio.close();}};
Settings.load();
setTimeout(boot,600);
</script>
